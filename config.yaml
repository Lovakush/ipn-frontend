repositories:
  - name: backend
    url: https://github.com/ultrapremiumdirect/backend.git
    local_path: ./repo_src/backend

  - name: frontend
    url: https://github.com/ultrapremiumdirect/frontend.git
    local_path: ./repo_src/frontend

output_dir: ./public/docs

exclude:
  - node_modules
  - vendor
  - .git
  - dist
  - build
  - __pycache__
  - coverage
  - var
  - tests
  - spec
  - features

ai_enhancement:
  enabled: true

  # ── Pick ONE provider — uncomment the block you want, comment out the others ──

  # Option 1: Claude (recommended — fast, low cost)
  provider: claude
  model: claude-haiku-4-5-20251001
  api_key: ${ANTHROPIC_API_KEY}

  # Option 2: OpenAI
  # provider: openai
  # model: gpt-4o-mini
  # api_key: ${OPENAI_API_KEY}

  # Option 3: Google Gemini
  # provider: gemini
  # model: gemini-1.5-flash
  # api_key: ${GEMINI_API_KEY}
