repositories:
  - name: backend
    # Full HTTPS clone URL — token injected from GH_READ_TOKEN env var
    url: https://github.com/your-org/backend-repo.git
    # Where the repo will be cloned/pulled locally (gitignored, never committed)
    local_path: ./repo_src/backend

  - name: frontend
    url: https://github.com/your-org/frontend-repo.git
    local_path: ./repo_src/frontend

# Where generated .md documentation files are written
output_dir: ./public/docs

# Paths/folders to skip when scanning source repos
exclude:
  - node_modules
  - vendor
  - .git
  - dist
  - build
  - __pycache__
  - coverage
  - var
  - tests
  - spec
  - features

ai_enhancement:
  enabled: true
  # "claude" (recommended — faster, cheaper) or "openai"
  provider: claude
  model: claude-haiku-4-5-20251001
  api_key: ${ANTHROPIC_API_KEY}

  # To use OpenAI instead:
  # provider: openai
  # model: gpt-4o-mini
  # api_key: ${OPENAI_API_KEY}