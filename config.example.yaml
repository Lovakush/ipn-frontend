repositories:
  - name: backend
    url: https://github.com/your-org/backend-repo.git
    local_path: ./repo_src/backend

  - name: frontend
    url: https://github.com/your-org/frontend-repo.git
    local_path: ./repo_src/frontend

output_dir: ./public/docs

exclude:
  - node_modules
  - vendor
  - .git
  - dist
  - build
  - __pycache__
  - coverage
  - var
  - tests
  - spec
  - features

ai_enhancement:
  enabled: true
  provider: claude
  model: claude-haiku-4-5-20251001
  api_key: ${ANTHROPIC_API_KEY}

  # provider: openai
  # model: gpt-4o-mini
  # api_key: ${OPENAI_API_KEY}

